<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Connection Lookup</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #f4f5f7;
    margin: 0;
    padding: 24px;
    display: flex;
    justify-content: center;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    padding: 24px;
    width: 100%;
    max-width: 480px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
    color: #1a1a1a;
  }
  .hint {
    font-size: 13px;
    color: #888;
    margin: 0 0 16px;
  }
  .search-wrap {
    position: relative;
  }
  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: #1a73e8;
  }

  /* Dropdown */
  .dropdown {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    max-height: 280px;
    overflow-y: auto;
    z-index: 10;
    display: none;
  }
  .dropdown.open { display: block; }
  .dropdown-item {
    padding: 10px 14px;
    cursor: pointer;
    border-bottom: 1px solid #f2f2f2;
  }
  .dropdown-item:last-child { border-bottom: none; }
  .dropdown-item:hover,
  .dropdown-item.active {
    background: #f0f6ff;
  }
  .dropdown-item .name {
    font-weight: 600;
    font-size: 14px;
    color: #1a1a1a;
  }
  .dropdown-item .id {
    font-size: 12px;
    color: #777;
    margin-top: 2px;
  }
  .dropdown-empty {
    padding: 12px 14px;
    font-size: 13px;
    color: #999;
  }

  #status {
    margin-top: 12px;
    font-size: 14px;
    color: #666;
    min-height: 18px;
  }
  #status.error { color: #c62828; }

  .result {
    margin-top: 20px;
    border-top: 1px solid #eee;
    padding-top: 16px;
    display: none;
  }
  .field {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid #f0f0f0;
    font-size: 14px;
  }
  .field .label { color: #666; flex-shrink: 0; }
  .field .value {
    text-align: right;
    font-weight: 500;
    color: #1a1a1a;
    word-break: break-word;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Connection Lookup</h1>
  <p class="hint">Type a Connection ID or Institution Name or EMIS_CODE</p>

  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="e.g. SD-135-J-K-6 or institution name or emis_code" autocomplete="off" autofocus>
    <div class="dropdown" id="dropdown"></div>
  </div>

  <div id="status"></div>
  <div class="result" id="result"></div>
</div>

<script>
  // ----- CONFIG: paste your Apps Script Web App URL here -----
  const API_URL = "https://script.google.com/macros/s/AKfycbzOIOKp0Q2OKG1h6N6cp3RdEIlrkhubHDoqMT_4Cqb1PY4WxYuaRUFVr0DYrpvAMTVt/exec";
  // -------------------------------------------------------------

  const searchInput = document.getElementById("searchInput");
  const dropdownEl = document.getElementById("dropdown");
  const statusEl = document.getElementById("status");
  const resultEl = document.getElementById("result");

  let debounceTimer = null;
  let activeIndex = -1;
  let currentMatches = [];

  // ---- Debounced live suggestions as the user types ----
  searchInput.addEventListener("input", () => {
    const q = searchInput.value.trim();
    resultEl.style.display = "none";
    statusEl.textContent = "";
    statusEl.className = "";

    clearTimeout(debounceTimer);
    if (!q) {
      closeDropdown();
      return;
    }
    debounceTimer = setTimeout(() => fetchSuggestions(q), 250);
  });

  searchInput.addEventListener("keydown", (e) => {
    if (!dropdownEl.classList.contains("open")) {
      if (e.key === "Enter") lookupExact(searchInput.value.trim());
      return;
    }
    if (e.key === "ArrowDown") {
      e.preventDefault();
      moveActive(1);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      moveActive(-1);
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (activeIndex >= 0 && currentMatches[activeIndex]) {
        selectMatch(currentMatches[activeIndex]);
      } else {
        lookupExact(searchInput.value.trim());
      }
    } else if (e.key === "Escape") {
      closeDropdown();
    }
  });

  document.addEventListener("click", (e) => {
    if (!e.target.closest(".search-wrap")) closeDropdown();
  });

  async function fetchSuggestions(q) {
    try {
      const res = await fetch(API_URL + "?suggest=" + encodeURIComponent(q));
      const json = await res.json();
      currentMatches = json.matches || [];
      renderDropdown(currentMatches);
    } catch (err) {
      closeDropdown();
    }
  }

  function renderDropdown(matches) {
    activeIndex = -1;
    dropdownEl.innerHTML = "";

    if (matches.length === 0) {
      const empty = document.createElement("div");
      empty.className = "dropdown-empty";
      empty.textContent = "No matches";
      dropdownEl.appendChild(empty);
      dropdownEl.classList.add("open");
      return;
    }

    matches.forEach((m, i) => {
      const item = document.createElement("div");
      item.className = "dropdown-item";
      item.dataset.index = i;
      var idLine = m.id + (m.emis ? " · EMIS: " + m.emis : "");
      item.innerHTML =
        '<div class="name">' + escapeHtml(m.name || "(no name)") + '</div>' +
        '<div class="id">' + escapeHtml(idLine) + '</div>';
      item.addEventListener("click", () => selectMatch(m));
      dropdownEl.appendChild(item);
    });
    dropdownEl.classList.add("open");
  }

  function moveActive(delta) {
    const items = dropdownEl.querySelectorAll(".dropdown-item");
    if (items.length === 0) return;
    items[activeIndex]?.classList.remove("active");
    activeIndex = (activeIndex + delta + items.length) % items.length;
    items[activeIndex].classList.add("active");
    items[activeIndex].scrollIntoView({ block: "nearest" });
  }

  function selectMatch(match) {
    searchInput.value = match.id;
    closeDropdown();
    lookupExact(match.id);
  }

  function closeDropdown() {
    dropdownEl.classList.remove("open");
    dropdownEl.innerHTML = "";
    activeIndex = -1;
    currentMatches = [];
  }

  // ---- Exact lookup (on Enter, or after picking a dropdown item) ----
  async function lookupExact(id) {
    closeDropdown();
    resultEl.style.display = "none";
    resultEl.innerHTML = "";

    if (!id) {
      statusEl.className = "error";
      statusEl.textContent = "Type a Connection ID first.";
      return;
    }

    statusEl.className = "";
    statusEl.textContent = "Searching...";

    try {
      const res = await fetch(API_URL + "?id=" + encodeURIComponent(id));
      const json = await res.json();

      if (json.error) {
        statusEl.className = "error";
        statusEl.textContent = "Error: " + json.error;
      } else if (!json.found) {
        statusEl.className = "error";
        statusEl.textContent = 'No exact match found for "' + id + '".';
      } else {
        statusEl.textContent = "Match found.";
        renderResult(json.data);
      }
    } catch (err) {
      statusEl.className = "error";
      statusEl.textContent = "Could not reach the server. Check the API_URL.";
    }
  }

  function renderResult(data) {
    resultEl.innerHTML = "";
    const priority = [
      "01 Connection ID",
      "02 Institution / Office Name",
      "03 IP",
      "04 MAC Address",
      "05 Package No.",
      "06 Vendor Name"
    ];
    const shown = new Set();

    priority.forEach(key => {
      if (key in data) {
        addField(key, data[key]);
        shown.add(key);
      }
    });

    Object.keys(data).forEach(key => {
      if (!shown.has(key) && key !== "_RowNumber") {
        addField(key, data[key]);
      }
    });

    resultEl.style.display = "block";
  }

  function addField(label, value) {
    const row = document.createElement("div");
    row.className = "field";
    row.innerHTML =
      '<span class="label">' + escapeHtml(label) + '</span>' +
      '<span class="value">' + escapeHtml(String(value ?? "")) + '</span>';
    resultEl.appendChild(row);
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
