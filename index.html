<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Connection Lookup</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #f4f5f7;
    margin: 0;
    padding: 24px;
    display: flex;
    justify-content: center;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    padding: 24px;
    width: 100%;
    max-width: 480px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
    color: #1a1a1a;
  }
  .hint {
    font-size: 13px;
    color: #888;
    margin: 0 0 16px;
  }
  .search-wrap {
    position: relative;
  }
  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: #1a73e8;
  }

  /* Dropdown */
  .dropdown {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    max-height: 280px;
    overflow-y: auto;
    z-index: 10;
    display: none;
  }
  .dropdown.open { display: block; }
  .dropdown-item {
    padding: 10px 14px;
    cursor: pointer;
    border-bottom: 1px solid #f2f2f2;
  }
  .dropdown-item:last-child { border-bottom: none; }
  .dropdown-item:hover,
  .dropdown-item.active {
    background: #f0f6ff;
  }
  .dropdown-item .name {
    font-weight: 600;
    font-size: 14px;
    color: #1a1a1a;
  }
  .dropdown-item .id {
    font-size: 12px;
    color: #777;
    margin-top: 2px;
  }
  .dropdown-empty {
    padding: 12px 14px;
    font-size: 13px;
    color: #999;
  }

  #status {
    margin-top: 12px;
    font-size: 14px;
    color: #666;
    min-height: 18px;
  }
  #status.error { color: #c62828; }

  .result {
    margin-top: 20px;
    border-top: 1px solid #eee;
    padding-top: 16px;
    display: none;
  }
  .field {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid #f0f0f0;
    font-size: 14px;
  }
  .field .label { color: #666; flex-shrink: 0; }
  .field .value {
    text-align: right;
    font-weight: 500;
    color: #1a1a1a;
    word-break: break-word;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Map icon button */
  .map-icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    background: #1a73e8;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    flex-shrink: 0;
    padding: 0;
    transition: background 0.2s;
  }
  .map-icon-btn:hover {
    background: #1557b0;
  }

  /* Map card for Geo Location */
  .map-card {
    margin-top: 20px;
    border: 2px solid #1a73e8;
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 2px 8px rgba(26, 115, 232, 0.15);
  }
  .map-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: linear-gradient(135deg, #1a73e8, #1557b0);
    color: #fff;
    font-weight: 600;
    font-size: 14px;
  }
  .map-card iframe {
    display: block;
    width: 100%;
    height: 240px;
    border: 0;
  }
  .map-actions {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: #f8f9fa;
    border-top: 1px solid #eee;
  }
  .go-to-location-btn {
    flex: 1;
    text-align: center;
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
    padding: 12px 16px;
    border-radius: 8px;
    background: linear-gradient(135deg, #1a73e8, #1557b0);
    color: #fff;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .go-to-location-btn:hover {
    background: linear-gradient(135deg, #1557b0, #0d47a1);
    box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3);
    transform: translateY(-2px);
  }
  .map-actions a {
    flex: 1;
    text-align: center;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    padding: 10px;
    border-radius: 6px;
    background: #fff;
    color: #1a73e8;
    border: 1px solid #1a73e8;
    transition: all 0.2s;
    cursor: pointer;
  }
  .map-actions a:hover {
    background: #f0f6ff;
    box-shadow: 0 2px 6px rgba(26, 115, 232, 0.2);
  }
</style>
</head>
<body>

<div class="card">
  <h1>Connection Lookup</h1>
  <p class="hint">Type a Connection ID or Institution Name or EMIS_CODE. View location on map with 📍 icon.</p>

  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="e.g. SD-135-J-K-6 or institution name or emis_code" autocomplete="off" autofocus>
    <div class="dropdown" id="dropdown"></div>
  </div>

  <div id="status"></div>
  <div class="result" id="result"></div>
</div>

<script>
  // ----- CONFIG: paste your Apps Script Web App URL here -----
  const API_URL = "https://script.google.com/macros/s/AKfycbzOIOKp0Q2OKG1h6N6cp3RdEIlrkhubHDoqMT_4Cqb1PY4WxYuaRUFVr0DYrpvAMTVt/exec";
  // -------------------------------------------------------------

  const searchInput = document.getElementById("searchInput");
  const dropdownEl = document.getElementById("dropdown");
  const statusEl = document.getElementById("status");
  const resultEl = document.getElementById("result");

  let debounceTimer = null;
  let activeIndex = -1;
  let currentMatches = [];

  // ---- Debounced live suggestions as the user types ----
  searchInput.addEventListener("input", () => {
    const q = searchInput.value.trim();
    resultEl.style.display = "none";
    statusEl.textContent = "";
    statusEl.className = "";

    clearTimeout(debounceTimer);
    if (!q) {
      closeDropdown();
      return;
    }
    debounceTimer = setTimeout(() => fetchSuggestions(q), 250);
  });

  searchInput.addEventListener("keydown", (e) => {
    if (!dropdownEl.classList.contains("open")) {
      if (e.key === "Enter") lookupExact(searchInput.value.trim());
      return;
    }
    if (e.key === "ArrowDown") {
      e.preventDefault();
      moveActive(1);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      moveActive(-1);
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (activeIndex >= 0 && currentMatches[activeIndex]) {
        selectMatch(currentMatches[activeIndex]);
      } else {
        lookupExact(searchInput.value.trim());
      }
    } else if (e.key === "Escape") {
      closeDropdown();
    }
  });

  document.addEventListener("click", (e) => {
    if (!e.target.closest(".search-wrap")) closeDropdown();
  });

  async function fetchSuggestions(q) {
    try {
      const res = await fetch(API_URL + "?suggest=" + encodeURIComponent(q));
      const json = await res.json();
      currentMatches = json.matches || [];
      renderDropdown(currentMatches);
    } catch (err) {
      closeDropdown();
    }
  }

  function renderDropdown(matches) {
    activeIndex = -1;
    dropdownEl.innerHTML = "";

    if (matches.length === 0) {
      const empty = document.createElement("div");
      empty.className = "dropdown-empty";
      empty.textContent = "No matches";
      dropdownEl.appendChild(empty);
      dropdownEl.classList.add("open");
      return;
    }

    matches.forEach((m, i) => {
      const item = document.createElement("div");
      item.className = "dropdown-item";
      item.dataset.index = i;
      var idLine = m.id + (m.emis ? " · EMIS: " + m.emis : "");
      item.innerHTML =
        '<div class="name">' + escapeHtml(m.name || "(no name)") + '</div>' +
        '<div class="id">' + escapeHtml(idLine) + '</div>';
      item.addEventListener("click", () => selectMatch(m));
      dropdownEl.appendChild(item);
    });
    dropdownEl.classList.add("open");
  }

  function moveActive(delta) {
    const items = dropdownEl.querySelectorAll(".dropdown-item");
    if (items.length === 0) return;
    items[activeIndex]?.classList.remove("active");
    activeIndex = (activeIndex + delta + items.length) % items.length;
    items[activeIndex].classList.add("active");
    items[activeIndex].scrollIntoView({ block: "nearest" });
  }

  function selectMatch(match) {
    searchInput.value = match.id;
    closeDropdown();
    lookupExact(match.id);
  }

  function closeDropdown() {
    dropdownEl.classList.remove("open");
    dropdownEl.innerHTML = "";
    activeIndex = -1;
    currentMatches = [];
  }

  // ---- Exact lookup (on Enter, or after picking a dropdown item) ----
  async function lookupExact(id) {
    closeDropdown();
    resultEl.style.display = "none";
    resultEl.innerHTML = "";

    if (!id) {
      statusEl.className = "error";
      statusEl.textContent = "Type a Connection ID first.";
      return;
    }

    statusEl.className = "";
    statusEl.textContent = "Searching...";

    try {
      const res = await fetch(API_URL + "?id=" + encodeURIComponent(id));
      const json = await res.json();

      if (json.error) {
        statusEl.className = "error";
        statusEl.textContent = "Error: " + json.error;
      } else if (!json.found) {
        statusEl.className = "error";
        statusEl.textContent = 'No exact match found for "' + id + '".';
      } else {
        statusEl.textContent = "Match found.";
        renderResult(json.data);
      }
    } catch (err) {
      statusEl.className = "error";
      statusEl.textContent = "Could not reach the server. Check the API_URL.";
    }
  }

  // Field name(s) that hold the geo coordinates. Adjust here if your
  // column header text is different.
  const GEO_FIELD_CANDIDATES = [
    "16 Geo Location",
    "Geo Location",
    "Location",
    "Coordinates",
    "Latitude Longitude",
    "lat lng",
    "latlong",
    "geo",
    "gps",
    "position"
  ];

  function findGeoField(data) {
    // Try exact matches first (case-insensitive)
    for (const key of GEO_FIELD_CANDIDATES) {
      const normalizedKey = key.toLowerCase().trim();
      for (const dataKey of Object.keys(data)) {
        if (dataKey.toLowerCase().trim() === normalizedKey && data[dataKey]) {
          return dataKey;
        }
      }
    }
    
    // Try partial matches
    for (const dataKey of Object.keys(data)) {
      const lowerKey = dataKey.toLowerCase();
      if ((lowerKey.includes("geo") || lowerKey.includes("location") || lowerKey.includes("lat") || lowerKey.includes("coord")) && data[dataKey]) {
        return dataKey;
      }
    }
    
    return null;
  }

  function renderResult(data) {
    resultEl.innerHTML = "";
    const priority = [
      "01 Connection ID",
      "02 Institution / Office Name",
      "03 IP",
      "04 MAC Address",
      "05 Package No.",
      "06 Vendor Name",
      "16 Geo Location"
    ];
    const shown = new Set();

    // Find the geo field (if present)
    const geoKey = findGeoField(data);

    priority.forEach(key => {
      if (key in data) {
        if (key === geoKey || (geoKey && key.toLowerCase().includes("geo"))) {
          // Render geo location with map icon
          addGeoField(key, data[key]);
        } else {
          addField(key, data[key]);
        }
        shown.add(key);
      }
    });

    Object.keys(data).forEach(key => {
      if (!shown.has(key) && key !== "_RowNumber") {
        if (key === geoKey) {
          addGeoField(key, data[key]);
        } else {
          addField(key, data[key]);
        }
        shown.add(key);
      }
    });

    // Render full map below results if geo location exists
    if (geoKey && data[geoKey]) {
      addMap(data[geoKey], geoKey);
    }

    resultEl.style.display = "block";
  }

  // Parses "lat lng" or "lat,lng" text and renders an embedded map preview
  // plus "Open in Maps" / "Get Directions" links.
  function addMap(geoText) {
    const coords = parseLatLng(geoText);
    if (!coords) return; // not a recognizable coordinate pair, skip silently

    const { lat, lng } = coords;
    const mapCard = document.createElement("div");
    mapCard.className = "map-card";

    // Map header with icon
    const header = document.createElement("div");
    header.className = "map-header";
    header.innerHTML = "📍 Customer Location Map";
    mapCard.appendChild(header);

    // Embedded map preview
    const iframe = document.createElement("iframe");
    iframe.loading = "lazy";
    iframe.src = "https://maps.google.com/maps?q=" + lat + "," + lng + "&z=15&output=embed";
    mapCard.appendChild(iframe);

    // Action buttons
    const actions = document.createElement("div");
    actions.className = "map-actions";

    // Primary "Go to Customer Location" button
    const goBtn = document.createElement("button");
    goBtn.className = "go-to-location-btn";
    goBtn.innerHTML = "📍 Go to Customer Location";
    goBtn.onclick = () => {
      window.open(
        "https://www.google.com/maps?q=" + lat + "," + lng,
        "_blank",
        "noopener"
      );
    };
    actions.appendChild(goBtn);

    // Secondary "Get Directions" link
    const dirLink = document.createElement("a");
    dirLink.href = "https://www.google.com/maps/dir/?api=1&destination=" + lat + "," + lng;
    dirLink.target = "_blank";
    dirLink.rel = "noopener";
    dirLink.textContent = "📍 Get Directions";
    actions.appendChild(dirLink);

    mapCard.appendChild(actions);
    resultEl.appendChild(mapCard);
  }

  function parseLatLng(text) {
    if (!text) return null;
    
    // Clean the text
    text = String(text).trim();
    if (!text) return null;
    
    // Try multiple formats:
    // 1. "22.632139 90.167391" (space-separated)
    // 2. "22.632139, 90.167391" (comma + space)
    // 3. "22.632139,90.167391" (comma-separated)
    // 4. "22.632139|90.167391" (pipe-separated)
    
    let match = text.match(
      /^(-?\d+(?:\.\d+)?)\s*[,|]\s*(-?\d+(?:\.\d+)?)$/
    );
    
    if (!match) {
      // Try space-separated without comma
      match = text.match(
        /^(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)$/
      );
    }
    
    if (!match) return null;
    return { lat: match[1], lng: match[2] };
  }

  function addField(label, value) {
    const row = document.createElement("div");
    row.className = "field";
    row.innerHTML =
      '<span class="label">' + escapeHtml(label) + '</span>' +
      '<span class="value">' + escapeHtml(String(value ?? "")) + '</span>';
    resultEl.appendChild(row);
  }

  function addGeoField(label, value) {
    const coords = parseLatLng(value);
    if (!coords) {
      // If not valid coordinates, render as normal field
      addField(label, value);
      return;
    }

    const row = document.createElement("div");
    row.className = "field";

    const labelSpan = document.createElement("span");
    labelSpan.className = "label";
    labelSpan.textContent = label;
    row.appendChild(labelSpan);

    const valueSpan = document.createElement("span");
    valueSpan.className = "value";

    const valueText = document.createElement("span");
    valueText.textContent = String(value ?? "");
    valueSpan.appendChild(valueText);

    // Create clickable map icon button
    const mapBtn = document.createElement("button");
    mapBtn.className = "map-icon-btn";
    mapBtn.title = "Open in Google Maps";
    mapBtn.innerHTML = "📍"; // Map pin icon
    mapBtn.addEventListener("click", (e) => {
      e.preventDefault();
      window.open(
        "https://www.google.com/maps?q=" + coords.lat + "," + coords.lng,
        "_blank",
        "noopener"
      );
    });
    valueSpan.appendChild(mapBtn);

    row.appendChild(valueSpan);
    resultEl.appendChild(row);
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
